      required: false
      selector:
        config_entry:
          integration: jellyfin_assist
    media_player:
      required: false
      selector:
        text: {}
    query:
      required: false
      selector:
        text: null
    operation:
      required: false
      selector:
        select:
          options:
          - play
          - add
          - queue_next
          - whats_playing
          - what_just_played
          - queue_status
          - queue_clear
          - queue_shuffle
