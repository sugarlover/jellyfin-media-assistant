search:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: jellyfin_assist
    query:
      required: true
      example: three am
      selector:
        text: null
    media_type:
      required: false
      selector:
        select:
          options:
          - Movie
          - Series
          - Episode
          - Audio
          - MusicAlbum
          - MusicArtist
          custom_value: false
    artist:
      required: false
      selector:
        text: null
    album:
      required: false
      selector:
        text: null
    series:
      required: false
      selector:
        text: null
    year:
      required: false
      selector:
        number:
          min: 1800
          max: 3000
          mode: box
