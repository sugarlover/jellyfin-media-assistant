play_on_chromecast:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: jellyfin_assist
    entity_id:
      required: true
      selector:
        entity:
          domain: media_player
    item_id:
      required: true
      selector:
        text: null
