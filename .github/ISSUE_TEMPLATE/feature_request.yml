name: Feature request
description: Suggest an improvement for Jellyfin Media Assistant.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Playback platform, if relevant
      options:
        - Chromecast
        - Other Home Assistant media player
        - Not playback-related
